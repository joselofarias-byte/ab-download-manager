name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "downloader/**"
      - "gradle/**"
      - "buildSrc/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JBR
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true

      - name: Show Android SDK state
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms" && ls -la "$ANDROID_HOME/platforms" || true
          test -d "$ANDROID_HOME/build-tools" && ls -la "$ANDROID_HOME/build-tools" || true

      - name: Prepare stable test signing key
        run: |
          mkdir -p "$RUNNER_TEMP/abdm-test-signing"
          base64 -d android/ci/abdm-test-debug.jks.b64 > "$RUNNER_TEMP/abdm-test-signing/abdm-test-debug.jks"
          echo "ABDM_TEST_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/abdm-test-signing/abdm-test-debug.jks" >> "$GITHUB_ENV"
          echo "ABDM_TEST_DEBUG_KEYSTORE_PASSWORD=abdmtest2026" >> "$GITHUB_ENV"
          echo "ABDM_TEST_DEBUG_KEY_ALIAS=abdm-test-debug" >> "$GITHUB_ENV"
          echo "ABDM_TEST_DEBUG_KEY_PASSWORD=abdmtest2026" >> "$GITHUB_ENV"

      - name: Test browser bridge
        run: ./gradlew :android:app:testDebugUnitTest --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :android:app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abdm-media-catcher-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  browser-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare pinned browser extension
        run: |
          git clone https://github.com/amir1376/ab-download-manager-browser-integration.git "$RUNNER_TEMP/browser-extension"
          git -C "$RUNNER_TEMP/browser-extension" checkout 1871203ce9665ea6802e8d1328f8b70c7dc9d948
          python android/browser-extension/prepare.py "$RUNNER_TEMP/browser-extension"
      - name: Build Android browser bundles
        working-directory: ${{ runner.temp }}/browser-extension
        run: |
          npm ci
          npm run pack:chrome
          npm run pack:firefox
          node -e 'for (const b of ["chrome", "firefox"]) { const m = require(`./dist/${b}/manifest.json`); if (m.permissions.includes("nativeMessaging")) throw Error("Unexpected native messaging"); if (b === "firefox" && !m.browser_specific_settings.gecko_android) throw Error("Missing Android declaration"); }'
      - uses: actions/upload-artifact@v4
        with:
          name: abdm-android-browser-extensions
          path: ${{ runner.temp }}/browser-extension/dist/*.zip
          if-no-files-found: error
